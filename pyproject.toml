[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visualdoc-ai"
version = "0.1.0"
description = "Experiments and reusable components for cited multimodal PDF question answering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24,<3",
]

[project.optional-dependencies]
# Everything the four notebooks need, including offline replay and the mocked API tests in 02.
notebooks = [
    "huggingface_hub",
    "ipykernel",
    "jupyter",
    "matplotlib",
    "numpy",
    "openai>=1.0",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "tiktoken",
    # E2 offline token expectation only (Qwen3-VL tokenizer and image-processor rules; no weights, no local inference)
    "transformers==5.23.0",
]
# Notebook 04 (E5): local visual retrieval with ColQwen2 v1.0 on Apple MPS (no API). Versions pinned by the E5 spec.
visual = [
    "pillow",
    "psutil",
    "safetensors",
    "torch==2.15.0",
    "transformers==5.23.0",
]
# Live answering in the application (`python -m visualdoc.pipeline --live`). The core modules need only pymupdf.
llm = [
    "openai>=1.0",
    "python-dotenv",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ even when the editable install's .pth file is hidden by macOS.
pythonpath = ["src"]
addopts = "-ra"

