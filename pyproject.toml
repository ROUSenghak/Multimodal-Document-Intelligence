[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visualdoc-ai"
version = "0.1.0"
description = "Experiments and reusable components for cited multimodal PDF question answering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24,<3",
]

[project.optional-dependencies]
# Everything the four notebooks need, including offline replay and the mocked API tests in 02.
notebooks = [
    "huggingface_hub",
    "ipykernel",
    "jupyter",
    "matplotlib",
    "numpy",
    "openai>=1.0",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "tiktoken",
]
# Kept for compatibility: live API runs need nothing beyond the notebooks extra.
llm = [
    "openai>=1.0",
    "python-dotenv",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

